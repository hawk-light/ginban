<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>吟ばん ランチ注文予定システム</title>

    <link rel="stylesheet"
          href="style.css?v=202406105">

</head>

<body>

<div class="container">

    <header>
        <h2>🐟 吟ばん ランチ注文予定</h2>
    </header>


    <div class="nickname-area">

        <label for="nickname">
            名前
        </label>
        <div>
            <input id="nickname" type="text">

            <div class="nickname-note">
                ※名前を入力して決定押してね
            </div>
        </div>
    </div>


    <hr>

    <section>

        <h3>メニュー</h3>

        <div id="menu-list">

            <!-- JavaScriptがここへ生成 -->

        </div>

    </section>

    <hr>

    <section>

        <h3>あなたの決定履歴</h3>

        <div id="order-list">

            <p>まだ決定されていません。</p>

        </div>
        <hr>

        <h3>みんなの決定履歴</h3>

        <div id="all-order-list"></div>
    </section>

</div>

<script type="module" src="script.js?v=20240611"></script>
</body>

</html>
